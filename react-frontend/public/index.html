<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=0">
    <link rel="icon" href="%PUBLIC_URL%/assets/img/logo.png" />
    <title>POS</title>
    <link rel="stylesheet" type="text/css" href="%PUBLIC_URL%/assets/css/bootstrap.min.css">
    <link rel="stylesheet" type="text/css" href="%PUBLIC_URL%/assets/css/font-awesome.min.css">

    <script>
      
      // 1. Get the current URL path (e.g., "/", "/admin")
      const path = window.location.pathname;

      // 2. Create a new link element
      const themeLink = document.createElement('link');
      themeLink.rel = 'stylesheet';
      themeLink.type = 'text/css';

      // 3. Conditional routing for your CSS files
      if (path.startsWith('/admin')) {
        themeLink.href = '%PUBLIC_URL%/assets/css/style.css';
      } else {
        themeLink.href = '%PUBLIC_URL%/assets/css/pos.css'; 
      }

      // 4. Append the stylesheet to the head before the page renders
      document.head.appendChild(themeLink);
  </script>
   
</head>

 <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>

    <script src="%PUBLIC_URL%/assets/js/jquery-3.2.1.min.js"></script>
	  <script src="%PUBLIC_URL%/assets/js/popper.min.js"></script>
    <script src="assets/js/bootstrap.min.js"></script>
  </body>

</html>
